# CI/CD to Azure Container Apps. No stored cloud secrets: `azure/login` authenticates with a
# federated credential, so GitHub presents a short-lived signed token and Azure trusts the
# repository and branch it names. Every `vars.*` below is an identifier, not a secret.
#
# The managed online endpoint demonstration is deliberately NOT here; it bills around the clock,
# so it lives in managed-endpoint-demo.yml behind workflow_dispatch (decision 13).
name: deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'notebooks/**'
      - 'docs/**'   # evidence screenshots and recordings; never a reason to redeploy
  workflow_dispatch:
    inputs:
      promote_version:
        description: 'Registry version to promote to champion before deploying (blank = deploy the current champion)'
        required: false
        default: ''
  # retrain.yml sends this after registering a winning challenger. The deploy job then runs in
  # the `production` environment, which requires a reviewer, so promotion is a human decision.
  repository_dispatch:
    types: [model-registered]

permissions:
  id-token: write   # required for OIDC; this is what replaces a stored credential
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_REPOSITORY: driftwatch
  # Set only by a promotion request; empty on ordinary pushes, which deploy the current champion.
  PROMOTE_VERSION: ${{ github.event.client_payload.version || inputs.promote_version || '' }}
  # Filled in by the "Pull the champion model" step (GITHUB_ENV); part of the image tag afterwards.
  MODEL_VERSION: ''

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.11'
      - name: Install the serving dependencies
        run: pip install -r serving/requirements.txt
      - name: Feature contract and request validation
        run: python -m scripts.sanity_check

  build-and-deploy:
    name: build, push, deploy
    needs: test
    runs-on: ubuntu-latest
    # A promotion runs in `production`, whose required reviewer must approve before the job starts.
    # Ordinary code pushes run in `ci`, which has no protection rules, so they are not gated.
    environment: ${{ (github.event.client_payload.version || inputs.promote_version) && 'production' || 'ci' }}
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5

      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6  # v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.11'

      # The dashboard is built here and copied into the image, like the model: the image never
      # needs Node. Exact versions come from dashboard/package-lock.json (npm ci refuses drift).
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Build the dashboard
        working-directory: dashboard
        run: |
          npm ci --no-audit --no-fund
          npm run build
          ls -la dist

      - name: Point at the workspace
        run: |
          az extension add --name ml --yes --only-show-errors
          URI=$(az ml workspace show --name "${{ vars.AZURE_ML_WORKSPACE }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" --query mlflow_tracking_uri -o tsv)
          echo "::add-mask::$URI"
          echo "MLFLOW_TRACKING_URI=$URI" >> "$GITHUB_ENV"
          echo "DRIFTWATCH_MODEL_NAME=${{ vars.DRIFTWATCH_MODEL_NAME }}" >> "$GITHUB_ENV"
          pip install -r requirements.txt

      # Only on a promotion request. By the time this runs, the `production` environment's
      # reviewer has approved. Registering a version never changes what ships; this step does.
      - name: Promote the requested version to champion
        if: env.PROMOTE_VERSION != ''
        run: |
          python -m training.promote --version "$PROMOTE_VERSION"
          python -m training.promote --show

      # The image must contain the model, so the registry pull happens before the build
      # (decision 11). fetch_model follows the champion tag, nothing else.
      - name: Pull the champion model into the build context
        run: |
          python -m serving.fetch_model
          echo "MODEL_VERSION=$(python -c "import json;print(json.load(open('serving/model/model_info.json'))['version'])")" >> "$GITHUB_ENV"

      - name: Log in to the container registry
        run: az acr login --name "${{ vars.ACR_NAME }}"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6
        with:
          context: .
          file: serving/Dockerfile
          push: true
          # Container Apps runs amd64. Runners are amd64 too, but stating it keeps an
          # arm64 Mac from pushing an image the platform silently refuses to start.
          platforms: linux/amd64
          # Tag = commit + model version. A promotion changes the model but not the commit, and
          # Container Apps only creates a new revision when the image string changes; tagging by
          # commit alone once left the old model serving after a "successful" promotion deploy.
          tags: |
            ${{ vars.ACR_NAME }}.azurecr.io/${{ env.IMAGE_REPOSITORY }}:${{ github.sha }}-v${{ env.MODEL_VERSION }}
            ${{ vars.ACR_NAME }}.azurecr.io/${{ env.IMAGE_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Deployed from the same Bicep template used by hand, so CI and local stay identical.
      - name: Deploy to Container Apps
        id: deploy
        run: |
          URL=$(az deployment group create \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "driftwatch-app-${{ github.run_number }}" \
            --template-file infra/containerapp.bicep \
            --parameters \
              image="${{ vars.ACR_NAME }}.azurecr.io/${{ env.IMAGE_REPOSITORY }}:${{ github.sha }}-v${{ env.MODEL_VERSION }}" \
              acrName="${{ vars.ACR_NAME }}" \
              storageAccountName="${{ vars.AZURE_STORAGE_ACCOUNT }}" \
            --query properties.outputs.url.value -o tsv)
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Deployed to $URL"

      # A deploy that reports success without a working endpoint is worse than a failed deploy.
      - name: Smoke-test the live endpoint
        run: |
          URL="${{ steps.deploy.outputs.url }}"
          for i in $(seq 1 30); do
            curl -fs --max-time 30 "$URL/health" > /tmp/health.json && break
            echo "waiting for a replica to start ($i/30)"; sleep 10
          done
          cat /tmp/health.json; echo
          curl -fs --max-time 30 -X POST "$URL/predict" \
            -H 'Content-Type: application/json' \
            -d @serving/examples/near_failure.json > /tmp/predict.json
          python - <<'PY'
          import json, os
          p = json.load(open("/tmp/predict.json"))
          print(f"unit={p['unit']} cycle={p['cycle']} probability={p['probability']:.4f} "
                f"label={p['label']} model={p['model']['name']} v{p['model']['version']}")
          assert p["label"] == 1, "the near-failure example should be flagged"
          expected = os.environ["MODEL_VERSION"]
          served = str(p["model"]["version"])
          assert served == expected, f"endpoint serves model version {served}, expected {expected}: the deploy did not take effect"
          print(f"live endpoint serves the model this run deployed (version {served})")
          PY

      # One JSON record per deploy, so the dashboard can show which model served when.
      - name: Record the deployment for the dashboard
        run: |
          python - <<'PY' > deployment.json
          import json, os, datetime
          print(json.dumps({
              "timestamp": datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "model_version": os.environ.get("MODEL_VERSION"),
              "image_tag": f"{os.environ['GITHUB_SHA']}-v{os.environ.get('MODEL_VERSION')}",
              "promotion": os.environ.get("PROMOTE_VERSION") or None,
              "event": os.environ.get("GITHUB_EVENT_NAME"),
              "run_url": f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
          }))
          PY
          az storage blob upload --auth-mode login --only-show-errors \
            --account-name "${{ vars.AZURE_STORAGE_ACCOUNT }}" --container-name predictions \
            --name "monitoring/deployments/$(date -u +%Y%m%dT%H%M%SZ).json" --file deployment.json

      - name: Summary
        if: always()
        run: |
          {
            echo "### DriftWatch deploy"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Endpoint | ${{ steps.deploy.outputs.url }} |"
            echo "| Image tag | \`${{ github.sha }}-v${MODEL_VERSION:-?}\` |"
            echo "| Model version | ${MODEL_VERSION:-unknown} |"
            echo "| Promotion | ${PROMOTE_VERSION:-none (deployed the current champion)} |"
          } >> "$GITHUB_STEP_SUMMARY"
