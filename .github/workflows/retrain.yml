# The retrain loop (decision 7): fired by drift.yml through repository_dispatch, or by hand.
# Trains a challenger on FD001 plus the replayed regime, judges it against the champion on the
# mixed held-out bench (decision 14), registers it only if it wins by a margin, and then asks
# deploy.yml to promote it. That deploy waits for a human in the `production` environment.
name: retrain

on:
  repository_dispatch:
    types: [drift-detected]
  workflow_dispatch:
    inputs:
      trials:
        description: 'Optuna trials for the XGBoost challenger'
        required: false
        default: '20'
      margin:
        description: 'ROC-AUC gain the challenger must show over the champion'
        required: false
        default: '0.005'

permissions:
  id-token: write
  contents: read

concurrency:
  group: retrain
  cancel-in-progress: false

jobs:
  retrain:
    name: challenger vs champion
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5

      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6  # v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.11'

      - name: Why this run exists
        if: github.event_name == 'repository_dispatch'
        env:
          PAYLOAD: ${{ toJSON(github.event.client_payload) }}
        run: |
          {
            echo "## Triggered by drift"
            echo ""
            echo '```json'
            echo "$PAYLOAD"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install the training stack
        run: pip install -r requirements.txt

      - name: Point at the workspace
        run: |
          az extension add --name ml --yes --only-show-errors
          URI=$(az ml workspace show --name "${{ vars.AZURE_ML_WORKSPACE }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" --query mlflow_tracking_uri -o tsv)
          echo "::add-mask::$URI"
          echo "MLFLOW_TRACKING_URI=$URI" >> "$GITHUB_ENV"
          echo "MLFLOW_EXPERIMENT_NAME=${{ vars.MLFLOW_EXPERIMENT_NAME }}" >> "$GITHUB_ENV"
          echo "DRIFTWATCH_MODEL_NAME=${{ vars.DRIFTWATCH_MODEL_NAME }}" >> "$GITHUB_ENV"

      - name: Pull the versioned tables
        run: dvc pull data/processed/train.parquet data/processed/test.parquet data/processed/holdout_official.parquet data/processed/fd002_train.parquet data/processed/fd002_test.parquet

      - name: Train the challengers on FD001 plus the regime
        run: |
          TRIALS="${{ inputs.trials }}"; TRIALS="${TRIALS:-20}"
          python -m training.train --model logreg --with-regime
          python -m training.tune --trials "$TRIALS" --with-regime

      - name: Champion vs challenger on the mixed bench
        id: challenge
        run: |
          MARGIN="${{ inputs.margin }}"; MARGIN="${MARGIN:-0.005}"
          # Only this run's own challengers are eligible (same short SHA the training runs were tagged with).
          python -m training.challenge --margin "$MARGIN" --commit "$(git rev-parse --short HEAD)" \
            --out monitoring/out/challenge.json | tee challenge.md
          cat challenge.md >> "$GITHUB_STEP_SUMMARY"
          echo "version=$(python -c "import json;print(json.load(open('monitoring/out/challenge.json'))['registered_version'] or '')")" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        if: always()
        with:
          name: challenge-result
          path: monitoring/out/challenge.json
          if-no-files-found: warn

      # The dashboard's performance view reads challenge results from blob storage.
      - name: Publish the challenge result for the dashboard
        if: always()
        run: |
          [ -f monitoring/out/challenge.json ] || exit 0
          az storage blob upload --auth-mode login --only-show-errors \
            --account-name "${{ vars.AZURE_STORAGE_ACCOUNT }}" --container-name predictions \
            --name "monitoring/challenges/$(date -u +%Y%m%dT%H%M%SZ).json" --file monitoring/out/challenge.json

      # Hands off to deploy.yml, whose production job waits for a required reviewer before
      # promoting the version to champion and shipping it.
      - name: Request promotion
        if: steps.challenge.outputs.version != ''
        env:
          RETRAIN_DISPATCH_TOKEN: ${{ secrets.RETRAIN_DISPATCH_TOKEN }}
        run: |
          python -m monitoring.retrain_trigger --event model-registered \
            --payload "{\"version\": \"${{ steps.challenge.outputs.version }}\", \"source\": \"retrain #${{ github.run_number }}\"}"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Promotion requested for version ${{ steps.challenge.outputs.version }}: deploy.yml is waiting for approval in the production environment." >> "$GITHUB_STEP_SUMMARY"
