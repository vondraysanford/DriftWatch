# Azure ML managed online endpoint: a demonstration, not a deployment target.
#
# Managed online endpoints bill per instance-hour around the clock with no scale-to-zero
# (roughly $70+/month if forgotten), so this workflow stands one up, proves it serves, captures
# the evidence, and tears it down in the same run. Teardown runs under `if: always()`, so a
# failed smoke test still removes the endpoint.
#
# It is manual-only on purpose (decision 13): it must never run on merge.
#
# Same contract as the persistent Container Apps demo: raw cycles in, probability out, features
# computed by the same data/features.py training used. Azure's no-code MLflow path was tried
# first and crashed on a missing Azure package, so the scoring script and environment are ours
# (infra/managed-endpoint/). The model is still the registered version, mounted by Azure.
name: managed-endpoint-demo

on:
  workflow_dispatch:
    inputs:
      model_version:
        description: 'Registry version to deploy (blank = latest)'
        required: false
        default: ''

permissions:
  id-token: write
  contents: read

concurrency:
  group: managed-endpoint-demo
  cancel-in-progress: false

jobs:
  demonstrate:
    name: deploy, prove, tear down
    runs-on: ubuntu-latest
    env:
      ENDPOINT_NAME: driftwatch-demo-${{ github.run_id }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5

      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6  # v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Prepare the Azure ML CLI
        run: az extension add --name ml --yes --only-show-errors

      # Managed online endpoints need Microsoft.PolicyInsights. Without it, endpoint creation
      # fails with `SubscriptionNotRegistered ... Resource provider [N/A]`, which does not say
      # which provider is missing. Checking here turns that into a message that names it.
      - name: Check the required resource providers
        run: |
          MISSING=""
          for P in Microsoft.PolicyInsights Microsoft.MachineLearningServices Microsoft.ContainerRegistry; do
            STATE=$(az provider show -n "$P" --query registrationState -o tsv 2>/dev/null || echo Unknown)
            echo "$P: $STATE"
            [ "$STATE" = "Registered" ] || MISSING="$MISSING $P"
          done
          if [ -n "$MISSING" ]; then
            echo "::error::Unregistered resource provider(s):$MISSING. Run: az provider register --namespace <name>"
            exit 1
          fi

      - name: Resolve the model version
        id: model
        run: |
          VERSION="${{ inputs.model_version }}"
          if [ -z "$VERSION" ]; then
            VERSION=$(az ml model list \
              --name "${{ vars.DRIFTWATCH_MODEL_NAME }}" \
              --workspace-name "${{ vars.AZURE_ML_WORKSPACE }}" \
              --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
              --query "max_by([], &to_number(version)).version" -o tsv)
          fi
          # The operating threshold travels with the model version as a tag (training.register).
          THRESHOLD=$(az ml model show \
            --name "${{ vars.DRIFTWATCH_MODEL_NAME }}" --version "$VERSION" \
            --workspace-name "${{ vars.AZURE_ML_WORKSPACE }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --query "tags.operating_threshold" -o tsv 2>/dev/null)
          if [ -z "$THRESHOLD" ]; then
            echo "::error::version $VERSION has no operating_threshold tag; training.register sets it"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "threshold=$THRESHOLD" >> "$GITHUB_OUTPUT"
          echo "Deploying ${{ vars.DRIFTWATCH_MODEL_NAME }} version $VERSION (operating threshold $THRESHOLD)"

      - name: Create the endpoint
        run: |
          az ml online-endpoint create \
            --name "$ENDPOINT_NAME" \
            --workspace-name "${{ vars.AZURE_ML_WORKSPACE }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --auth-mode key

      # No scoring script and no environment: the registered model is in MLflow format, so
      # Azure ML builds the serving container itself. This is the fastest honest path from
      # registry to live endpoint, and it is the point of the demonstration.
      # The code snapshot is score.py plus the shared data/ package, so the endpoint computes
      # features with exactly the code training used. Assembled here rather than committed.
      - name: Assemble the scoring code
        run: |
          rm -rf infra/managed-endpoint/code
          mkdir -p infra/managed-endpoint/code/data
          cp infra/managed-endpoint/score.py infra/managed-endpoint/code/
          cp data/*.py infra/managed-endpoint/code/data/
          find infra/managed-endpoint/code -type f | sort

      # `online-deployment create` takes a YAML file (unlike `online-endpoint create`, which
      # accepts --name). The model reference and threshold are injected with --set so nothing
      # deployment-specific is hardcoded in the spec. Azure builds the environment image from
      # conda.yml in the workspace; the first build takes several minutes, later ones are cached.
      - name: Create the deployment
        run: |
          az ml online-deployment create \
            --file infra/managed-endpoint/deployment.yml \
            --endpoint-name "$ENDPOINT_NAME" \
            --workspace-name "${{ vars.AZURE_ML_WORKSPACE }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --set model="azureml:${{ vars.DRIFTWATCH_MODEL_NAME }}:${{ steps.model.outputs.version }}" \
            --set environment_variables.OPERATING_THRESHOLD="${{ steps.model.outputs.threshold }}" \
            --all-traffic

      # The same raw-cycle example bodies the Container App is smoke-tested with. The run fails
      # if the near-failure window is not flagged or the healthy one is, so a green run means
      # the endpoint answered correctly, not merely that it answered.
      - name: Invoke it and time the response
        run: |
          SKU=$(awk '/^instance_type:/ {print $2}' infra/managed-endpoint/deployment.yml)
          {
            echo "## Managed endpoint demonstration"
            echo ""
            echo "Registered model \`${{ vars.DRIFTWATCH_MODEL_NAME }}\` version ${{ steps.model.outputs.version }} on one \`$SKU\`, threshold ${{ steps.model.outputs.threshold }}."
            echo ""
            echo "| # | window | probability | label | round trip |"
            echo "|---|---|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          i=0; FAILED=0
          for EXAMPLE in near_failure healthy near_failure healthy near_failure; do
            i=$((i + 1))
            START=$(date +%s%N)
            RESULT=$(az ml online-endpoint invoke \
              --name "$ENDPOINT_NAME" \
              --workspace-name "${{ vars.AZURE_ML_WORKSPACE }}" \
              --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
              --request-file "serving/examples/$EXAMPLE.json" -o tsv)
            MS=$(( ($(date +%s%N) - START) / 1000000 ))
            echo "invocation $i ($EXAMPLE): ${MS} ms -> $RESULT"
            python3 - "$EXAMPLE" "$MS" "$RESULT" <<'PY' >> "$GITHUB_STEP_SUMMARY" || FAILED=1
          import json, sys
          example, ms, raw = sys.argv[1], sys.argv[2], sys.argv[3]
          d = json.loads(raw)
          if isinstance(d, str):  # az sometimes double-encodes the response body
              d = json.loads(d)
          expected = 1 if example == "near_failure" else 0
          print(f"| {example} | {d['probability']:.4f} | {d['label']} | {ms} ms |")
          sys.exit(0 if d["label"] == expected else 1)
          PY
          done
          if [ "$FAILED" = "1" ]; then
            echo "::error::at least one invocation returned the wrong label"
            exit 1
          fi

      # Both containers' logs go to the job output as well as the artifact, so a crashed
      # deployment shows its traceback right here instead of behind an artifact download.
      - name: Capture endpoint details and logs
        if: always()
        run: |
          mkdir -p evidence
          az ml online-endpoint show --name "$ENDPOINT_NAME" \
            --workspace-name "${{ vars.AZURE_ML_WORKSPACE }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" > evidence/endpoint.json || true
          for CONTAINER in inference-server storage-initializer; do
            echo "::group::$CONTAINER logs"
            az ml online-deployment get-logs --name blue --endpoint-name "$ENDPOINT_NAME" \
              --workspace-name "${{ vars.AZURE_ML_WORKSPACE }}" \
              --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
              --container "$CONTAINER" --lines 300 | tee "evidence/$CONTAINER.log" || true
            echo "::endgroup::"
          done

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        if: always()
        with:
          name: managed-endpoint-evidence
          path: evidence/

      # The whole reason this workflow is separate. Runs even if anything above failed.
      - name: Tear down
        if: always()
        run: |
          az ml online-endpoint delete \
            --name "$ENDPOINT_NAME" \
            --workspace-name "${{ vars.AZURE_ML_WORKSPACE }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --yes --no-wait
          echo "Requested deletion of $ENDPOINT_NAME"

      - name: Confirm nothing is left billing
        if: always()
        run: |
          for i in $(seq 1 30); do
            REMAINING=$(az ml online-endpoint list \
              --workspace-name "${{ vars.AZURE_ML_WORKSPACE }}" \
              --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
              --query "length([?name=='$ENDPOINT_NAME'])" -o tsv 2>/dev/null || echo 0)
            if [ "$REMAINING" = "0" ]; then
              echo "Confirmed: $ENDPOINT_NAME is gone."
              echo "" >> "$GITHUB_STEP_SUMMARY"
              echo "Endpoint torn down and confirmed deleted." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "still deleting ($i/30)"; sleep 20
          done
          echo "::error::$ENDPOINT_NAME still exists after 10 minutes. DELETE IT MANUALLY: it bills hourly."
          exit 1
