# Scheduled drift monitoring (decision 12). Reads the prediction log from Blob Storage, compares
# it with the FD001 training reference using Evidently, publishes the reports, and on drift fires
# repository_dispatch so retrain.yml runs. The dispatch needs a fine-grained PAT (the built-in
# GITHUB_TOKEN cannot start workflows); that is a GitHub credential, not a cloud one.
name: drift

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      since_hours:
        description: 'Look back this many hours of prediction logs'
        required: false
        default: '24'
      only_regime:
        description: 'Restrict to fd001 or fd002 traffic (blank = everything in the window)'
        required: false
        default: ''

permissions:
  id-token: write
  contents: read

concurrency:
  group: drift
  cancel-in-progress: false

jobs:
  detect:
    name: detect drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5

      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6  # v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.11'

      - name: Install the monitoring dependencies
        run: pip install -r monitoring/requirements.txt

      # The reference is the versioned training data, pulled from the DVC remote with the same
      # federated identity (Storage Blob Data Contributor on the account).
      - name: Pull the reference data
        run: |
          dvc pull data/interim/fd001_train.parquet data/processed/train.parquet \
                   data/interim/fd002_train.parquet data/processed/fd002_train.parquet
          ls -la data/interim data/processed

      # The reference must be what the champion trained on. Its `data` tag says fd001 or
      # fd001+fd002; its test_roc_auc tag is the number the performance line compares against.
      - name: Read the champion's training set and reference ROC-AUC from the registry
        id: champion
        run: |
          az extension add --name ml --yes --only-show-errors
          LIST="az ml model list --name ${{ vars.DRIFTWATCH_MODEL_NAME }} --workspace-name ${{ vars.AZURE_ML_WORKSPACE }} --resource-group ${{ vars.AZURE_RESOURCE_GROUP }}"
          AUC=$($LIST --query "[?tags.stage=='champion'].tags.test_roc_auc | [0]" -o tsv 2>/dev/null || true)
          DATA=$($LIST --query "[?tags.stage=='champion'].tags.data | [0]" -o tsv 2>/dev/null || true)
          VERSION=$($LIST --query "[?tags.stage=='champion'].version | [0]" -o tsv 2>/dev/null || true)
          echo "auc=${AUC}" >> "$GITHUB_OUTPUT"
          echo "data=${DATA:-fd001}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "champion: version ${VERSION:-?}, trained on ${DATA:-fd001}, test_roc_auc ${AUC:-unknown}"

      - name: Run the detector
        env:
          AZURE_STORAGE_ACCOUNT: ${{ vars.AZURE_STORAGE_ACCOUNT }}
        run: |
          SINCE="${{ inputs.since_hours }}"; SINCE="${SINCE:-24}"
          REGIME="${{ inputs.only_regime }}"
          AUC="${{ steps.champion.outputs.auc }}"
          VERSION="${{ steps.champion.outputs.version }}"
          # Performance is scored only on the champion's own predictions: a window spanning a
          # promotion holds two models' predictions, and pooling them once reported 0.62 for a
          # champion that scored 0.99 (v1's 0.50 and v2's 0.99 averaged).
          python -m monitoring.drift --logs-from blob --since-hours "$SINCE" \
            --reference-set "${{ steps.champion.outputs.data }}" \
            --labels-from data/interim/fd001_train.parquet data/interim/fd002_train.parquet \
            ${AUC:+--reference-auc "$AUC"} ${VERSION:+--champion-version "$VERSION"} ${REGIME:+--only-regime "$REGIME"} \
            --out monitoring/out
          cat monitoring/out/verdict.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        if: always()
        with:
          name: drift-report
          path: |
            monitoring/out/verdict.json
            monitoring/out/verdict.md
            monitoring/out/*.html
          if-no-files-found: warn

      # The dashboard reads verdicts from blob storage, next to the prediction log.
      - name: Publish the verdict for the dashboard
        if: always()
        run: |
          [ -f monitoring/out/verdict.json ] || exit 0
          az storage blob upload --auth-mode login --only-show-errors \
            --account-name "${{ vars.AZURE_STORAGE_ACCOUNT }}" --container-name predictions \
            --name "monitoring/verdicts/$(date -u +%Y%m%dT%H%M%SZ).json" --file monitoring/out/verdict.json

      # Sends repository_dispatch(drift-detected) only when the verdict says drift; a no-drift or
      # not-enough-data verdict exits 0 without dispatching. A failed HTTP call fails the job.
      - name: Trigger retraining on drift
        env:
          RETRAIN_DISPATCH_TOKEN: ${{ secrets.RETRAIN_DISPATCH_TOKEN }}
        run: python -m monitoring.retrain_trigger --verdict monitoring/out/verdict.json
